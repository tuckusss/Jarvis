name: Build JARVIS Windows installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete source checkout
        shell: pwsh
        run: |
          @('main.py','requirements.txt','packaging/build_installer.ps1','packaging/JARVIS.iss','jarvis/ui.py','jarvis/local_ai.py','jarvis/wake_model.py') | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Source file missing: $_. Upload the complete JARVIS v0.5 project before building." }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pyinstaller>=6.10,<7'
          choco install innosetup --yes --no-progress
      - name: Build verified offline models and installer
        shell: pwsh
        env:
          JARVIS_SIGNING_PFX_BASE64: ${{ secrets.JARVIS_SIGNING_PFX_BASE64 }}
          JARVIS_SIGNING_PASSWORD: ${{ secrets.JARVIS_SIGNING_PASSWORD }}
        run: .\packaging\build_installer.ps1 -SkipDependencyInstall -Version '0.5.0'
      - name: Smoke-test installation
        shell: pwsh
        run: .\packaging\smoke_install.ps1 -Installer '.\dist\JARVIS-Setup-0.5.0-x64.exe'
      - name: Verify checksum and size
        shell: pwsh
        run: |
          $f = '.\dist\JARVIS-Setup-0.5.0-x64.exe'
          if ((Get-Item $f).Length -lt 500MB) { throw 'Installer is too small for bundled offline model' }
          Get-FileHash $f -Algorithm SHA256 | Format-List
          Get-AuthenticodeSignature $f | Format-List
      - name: Store private draft installer candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jarvis-ci-${{ github.run_id }}" '.\dist\JARVIS-Setup-0.5.0-x64.exe' --draft --prerelease --title 'JARVIS Windows installation candidate' --notes 'Build candidate only; signing and physical Windows voice testing required before distribution.' --target '${{ github.sha }}'
